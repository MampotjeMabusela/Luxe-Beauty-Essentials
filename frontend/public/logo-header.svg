<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" fill="none" role="img" aria-label="Luxe Beauty and Essentials">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B978"/>
      <stop offset="50%" stop-color="#C9A962"/>
      <stop offset="100%" stop-color="#A68B4B"/>
    </linearGradient>
    <linearGradient id="hb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A1F15"/>
      <stop offset="100%" stop-color="#3D2C1E"/>
    </linearGradient>
    <radialGradient id="hglow" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFF4D6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#E6CF98" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9A7D3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hshine" x1="16" y1="14" x2="40" y2="42">
      <stop offset="0%" stop-color="#FFF9E8" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#F1DFAF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F1DFAF" stop-opacity="0"/>
    </linearGradient>
    <filter id="hShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="1.6" flood-color="#120D08" flood-opacity="0.5"/>
      <feDropShadow dx="-0.6" dy="-0.6" stdDeviation="0.9" flood-color="#F5E4BE" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Emblem -->
  <g filter="url(#hShadow)">
