  <path d="M43.7 11.5l1.3 2.5 2.8 0.4-2 1.9 0.5 2.7-2.6-1.3-2.5 1.3 0.5-2.7-2-1.9 2.8-0.4z" fill="#F6E8C4" opacity="0.85"/>
  <circle cx="47.5" cy="22.5" r="1.2" fill="#F8EED4" opacity="0.8"/>
