  <path d="M8 28c0-11 9-20 20-20" stroke="url(#hg)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.72"/>
  <!-- Wordmark -->
  <text x="62" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#3D2C1E" letter-spacing="0.02em" filter="url(#hShadow)">LUXE</text>
  <text x="62" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#F0DFAF" letter-spacing="0.02em" opacity="0.23">LUXE</text>
  <text x="62" y="42" font-family="system-ui, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#C9A962" letter-spacing="0.14em">BEAUTY &amp; ESSENTIALS</text>
  <line x1="62" y1="30" x2="348" y2="30" stroke="url(#hg)" stroke-width="0.75" opacity="0.45"/>
