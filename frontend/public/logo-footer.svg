  <path d="M56 16.5l1.8 3.3 3.7 0.5-2.7 2.6 0.7 3.6-3.5-1.8-3.4 1.8 0.7-3.6-2.7-2.6 3.7-0.5z" fill="#F7E7BE" opacity="0.9"/>
  <circle cx="62.5" cy="30" r="1.3" fill="#F8EDD2" opacity="0.82"/>
