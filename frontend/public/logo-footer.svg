<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none" role="img" aria-label="Luxe Beauty and Essentials">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="50%" stop-color="#C9A962"/>
      <stop offset="100%" stop-color="#9A7D3A"/>
    </linearGradient>
    <linearGradient id="fc" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F8F4EF"/>
      <stop offset="100%" stop-color="#E8D5C4"/>
    </linearGradient>
    <radialGradient id="fglow" cx="32%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#FFF3CD" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#D7BA75" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8D7134" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fshine" x1="20" y1="18" x2="52" y2="52">
      <stop offset="0%" stop-color="#FFF9E6" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#EED9A0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EED9A0" stop-opacity="0"/>
    </linearGradient>
    <filter id="fDepth" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1.3" dy="1.9" stdDeviation="2.1" flood-color="#090604" flood-opacity="0.6"/>
      <feDropShadow dx="-0.8" dy="-0.8" stdDeviation="1.2" flood-color="#F5E3B8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Emblem -->
  <g filter="url(#fDepth)">
