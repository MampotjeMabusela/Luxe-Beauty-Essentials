  <text x="82" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="url(#fc)" letter-spacing="0.03em" filter="url(#fDepth)">LUXE</text>
  <text x="82" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#F8E8C1" letter-spacing="0.03em" opacity="0.2">LUXE</text>
  <text x="82" y="52" font-family="system-ui, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="url(#fg)" letter-spacing="0.12em">BEAUTY &amp; ESSENTIALS</text>
  <line x1="82" y1="38" x2="368" y2="38" stroke="url(#fg)" stroke-width="1" opacity="0.5"/>
  <text x="82" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#E8D5C4" opacity="0.7" letter-spacing="0.15em">SOUTH AFRICA</text>
